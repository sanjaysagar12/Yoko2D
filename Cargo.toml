[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
egui = "0.29"
eframe = "0.29"
assert_cmd = "2"
predicates = "3"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
tempfile = "3.27.0"
